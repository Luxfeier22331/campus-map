        <script>
        var highlightLayer;
        var selectedBuilding = null;
        function highlightFeature(e) {
            highlightLayer = e.target;
            if (e.target.options.pane === 'pane__5' || e.target.options.pane === 'pane__4') return;
            if (e.target.options.pane === 'pane__3') {
                var sportsSurface = campusSportsSurface(e.target.feature);
                highlightLayer.setStyle({ color: campusShade(sportsSurface.stroke, -0.15), weight: 2.2, fillOpacity: 1 });
                return;
            }
            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
                highlightLayer.setStyle({ color: '#727d78', opacity: 0.9 });
            } else {
                highlightLayer.setStyle({ fillColor: '#f0e3bc', fillOpacity: 0.86 });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:19, minZoom:14
        }).fitBounds([[39.80568409255671,116.10310136576231],[39.8142909422097,116.11805609538932]]);
        var campusSportsPattern = new L.StripePattern({ width: 12, height: 12, weight: 2, spaceWeight: 10, color: '#d9f2bf', spaceColor: '#4eae5b', opacity: 1, spaceOpacity: 1 });
        campusSportsPattern.addTo(map);
        var campusCourtPattern = new L.Pattern({ width: 16, height: 16 });
        campusCourtPattern.addShape(new L.PatternRect({ x: 0, y: 0, width: 16, height: 16, stroke: false, fill: true, fillColor: '#76bfc9', fillOpacity: 1 }));
        campusCourtPattern.addShape(new L.PatternPath({ d: 'M0 0L16 16M-8 8L8 24M8 -8L24 8', color: '#d4edf0', weight: 0.8, opacity: 0.65, fill: false }));
        campusCourtPattern.addTo(map);
        var campusTrackPattern = new L.StripePattern({ width: 14, height: 14, weight: 1, spaceWeight: 13, color: '#f4d5c8', spaceColor: '#c77963', opacity: 0.95, spaceOpacity: 1 });
        campusTrackPattern.addTo(map);
        function campusSportsSurface(feature) {
            var name = feature.properties && feature.properties.name || '';
            if (name === '田径场') return { fill: '#c77963', stroke: '#8d4c3b', pattern: campusTrackPattern };
            if (/篮球|排球|网球/.test(name)) return { fill: '#76bfc9', stroke: '#337784', pattern: campusCourtPattern };
            if (name === '气膜馆') return { fill: '#b8cddc', stroke: '#5c7c94', pattern: null };
            return { fill: '#4eae5b', stroke: '#27703d', pattern: campusSportsPattern };
        }
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> · <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> · <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        function campusEscape(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(character) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[character];
            });
        }
        function campusShade(hex, amount) {
            var value = String(hex || '').replace('#', '');
            if (value.length === 3) value = value[0] + value[0] + value[1] + value[1] + value[2] + value[2];
            if (value.length !== 6) return hex;
            var parsed = parseInt(value, 16);
            if (isNaN(parsed)) return hex;
            var target = amount < 0 ? 0 : 255;
            var ratio = Math.abs(amount);
            var red = Math.round(((parsed >> 16) & 255) + (target - ((parsed >> 16) & 255)) * ratio);
            var green = Math.round(((parsed >> 8) & 255) + (target - ((parsed >> 8) & 255)) * ratio);
            var blue = Math.round((parsed & 255) + (target - (parsed & 255)) * ratio);
            return '#' + ((1 << 24) + (red << 16) + (green << 8) + blue).toString(16).slice(1);
        }
        function buildCampusCard(input) {
            var tags = (input.tags || []).filter(function(tag) { return tag; });
            var metadata = (input.metadata || []).filter(function(item) { return item[1]; });
            return '<div class="campus-card">' +
                '<div class="campus-card-head">' +
                    '<span class="campus-card-icon" aria-hidden="true">' +
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                            '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>' +
                    '</span>' +
                    '<div class="campus-card-title"><h3>' + campusEscape(input.title) + '</h3>' +
                        (input.subtitle ? '<p class="campus-card-sub">' + campusEscape(input.subtitle) + '</p>' : '') +
                    '</div>' +
                '</div>' +
                (input.description ? '<p class="campus-card-desc">' + campusEscape(input.description) + '</p>' : '') +
                (tags.length ? '<div class="campus-card-tags">' + tags.map(function(tag) {
                    return '<span class="campus-card-tag">' + campusEscape(tag) + '</span>';
                }).join('') + '</div>' : '') +
                (metadata.length ? '<details class="campus-card-meta"><summary>名称来源与核对说明</summary>' + metadata.map(function(item) {
                    return '<p><strong>' + campusEscape(item[0]) + '：</strong>' + campusEscape(item[1]) + '</p>';
                }).join('') + '</details>' : '') +
                '</div>';
        }
        function bindCampusCard(layer, html) {
            layer.bindPopup(html, {
                className: 'campus-place-card',
                closeButton: true,
                maxHeight: 320,
                maxWidth: 300,
                offset: [0, -4],
                autoPanPadding: [18, 18]
            });
        }
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
