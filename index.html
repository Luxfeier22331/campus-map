<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#edf1ed">
    <title>中央民族大学丰台校区 · 校园导览</title>
    <link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
    <link rel="stylesheet" href="css/campus-maplibre.css">
    <script defer src="vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
    <script defer src="data/_1.js"></script>
    <script defer src="data/_2.js"></script>
    <script defer src="data/_3.js"></script>
    <script defer src="data/_4.js"></script>
    <script defer src="data/_5.js"></script>
    <script defer src="js/campus-maplibre.js?v=ed6c643"></script>
</head>
<body>
    <main id="map" aria-label="中央民族大学丰台校区校园地图"></main>
    <header class="info">
        <h1>中央民族大学 · 丰台校区</h1>
        <p>校园建筑导览 <span class="engine-badge">MapLibre GL</span></p>
    </header>
    <div id="map-status" class="map-status" role="status" aria-live="polite">正在加载校园地图…</div>
    <div id="map-error" class="map-error" role="alert" hidden></div>
    <details class="campus-layer-control" id="campus-layers">
        <summary aria-label="展开地图图层">图层</summary>
        <div class="campus-layer-list">
            <label><input type="checkbox" data-layer="buildings" checked>建筑与校门</label>
            <label><input type="checkbox" data-layer="sports" checked><i class="campus-map-swatch campus-map-swatch-sports" aria-hidden="true"></i>运动场地</label>
            <label><input type="checkbox" data-layer="roads" checked><i class="campus-map-swatch campus-map-swatch-roads" aria-hidden="true"></i>道路</label>
            <label><input type="checkbox" data-layer="green" checked><i class="campus-map-swatch campus-map-swatch-green" aria-hidden="true"></i>绿地</label>
            <label><input type="checkbox" data-layer="boundary" checked>校园边界</label>
        </div>
    </details>
    <aside class="campus-name-control is-collapsed" aria-label="建筑导览">
        <button type="button" class="campus-panel-toggle" id="campus-panel-toggle" aria-expanded="false" aria-controls="campus-panel-body">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <span>建筑导览</span>
            <span class="campus-panel-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="campus-panel-body" id="campus-panel-body" hidden>
            <div class="campus-panel-toggles"><label><input type="checkbox" id="campus-name-toggle" checked>名称</label></div>
            <label class="campus-select-label" for="campus-building-select">单栋建筑</label>
            <select id="campus-building-select" disabled><option value="">选择名称或编号定位…</option></select>
            <div class="campus-selection-row">
                <span class="campus-selection-note" id="campus-selection-status" aria-live="polite">点选地图上的建筑，或从列表定位</span>
                <button type="button" class="campus-clear-selection" id="campus-clear-selection" disabled>清除</button>
            </div>
            <div class="campus-legend-title">类型筛选</div>
            <div class="campus-legend" id="campus-category-legend"></div>
            <div class="campus-surface-key" aria-label="地表与校门图例">
                <span><i class="campus-map-swatch campus-map-swatch-green" aria-hidden="true"></i>绿地</span>
                <span><i class="campus-map-swatch campus-map-swatch-turf" aria-hidden="true"></i>草坪场地</span>
                <span><i class="campus-map-swatch campus-map-swatch-court" aria-hidden="true"></i>球场</span>
                <span><i class="campus-map-swatch campus-map-swatch-track" aria-hidden="true"></i>田径跑道</span>
                <span><i class="campus-map-swatch campus-map-swatch-gates" aria-hidden="true"></i>北门蓝 / 南门橙</span>
            </div>
            <p class="campus-source-link"><a href="building-name-review.html" target="_blank" rel="noopener">名称来源与待核说明</a></p>
        </div>
    </aside>
    <section class="measure-panel" id="measure-panel" aria-label="地图测量" hidden>
        <div class="measure-modes">
            <button type="button" id="measure-distance">测距离</button>
            <button type="button" id="measure-area">测面积</button>
            <button type="button" id="measure-close" aria-label="关闭测量">×</button>
        </div>
        <p id="measure-result" aria-live="polite">选择测量方式，在地图上依次点选。</p>
        <button type="button" id="measure-clear">清空测量</button>
    </section>
    <noscript><p class="map-error">请启用 JavaScript 以使用校园导览。</p></noscript>
</body>
</html>
